name: factory-maintenance
description: Scheduled bounded Factory housekeeping with one existing-issue intake, stale-workable refresh, and repository sweep.
steps:
  - id: startup
    name: Prepare workflow environment
    # Runs inside Cezar's Linux container. FACTORY_RUNTIME_ROOT is the mounted
    # container checkout, not a Windows host path.
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-maintenance -Step housekeeping -RequireGh -RequiredScripts watchdog-automations.ps1,sync-issue-delivery.ps1,select-intake-issue.ps1,classify-intake.ps1,validate-intake-or-no-work.ps1,route-intake-or-no-work.ps1,validate-result.ps1,route-state.ps1,recover-audit-reservations.ps1,audit-backlog-labels.ps1,validate-backlog-label-audit-input.ps1,apply-backlog-label-audit.ps1,refresh-stale-workable.ps1,maintain-repository.ps1,gh-cache.ps1,lifecycle-lib.ps1,sweep-lifecycle.ps1,assert-no-run-commits.ps1,audit-shadow-copies.ps1,probe-model-endpoint.ps1
    timeoutSeconds: 60
  # Liveness backstop first, so it runs even if a later step hangs: this hourly run cancels any earlier
  # run of a bounded workflow (including a previous stuck maintenance run) that outlived 30 minutes,
  # and returns its issue to factory:investigate. Command steps have their own deadlines; this covers
  # a stuck agent step. It never cancels the run it belongs to.
  - id: watchdog
    name: Cancel bounded Factory runs that outlived their liveness budget
    command: 'if [ -n "$CEZ_API_URL" ] && [ -n "$CEZ_PROJECT_ID" ]; then pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/watchdog-automations.ps1 -ApiUrl "$CEZ_API_URL" -ProjectId "$CEZ_PROJECT_ID" -MaxRunMinutes 30 -Workflow factory-maintenance,factory-intake,factory-health,factory-environment-analysis -ExcludeRunId "$CEZ_TASK_ID" -RouteCancelledRuns; else echo "watchdog skipped: Cezar API is not reachable from this run"; fi'
    timeoutSeconds: 120
  # Issue runs get a liveness budget too, far above what they normally take. An implementation or fix run
  # that outlives it is cancelled and its issue goes to factory:investigate. A plan, review or investigate
  # run is only cancelled: its issue keeps its state, and the stale refresher re-triggers it.
  - id: watchdog-issue-runs
    name: Cancel issue runs that outlived their liveness budget
    command: 'if [ -n "$CEZ_API_URL" ] && [ -n "$CEZ_PROJECT_ID" ]; then pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/watchdog-automations.ps1 -ApiUrl "$CEZ_API_URL" -ProjectId "$CEZ_PROJECT_ID" -MaxRunMinutes 360 -Workflow factory-implement,factory-fix-review -ExcludeRunId "$CEZ_TASK_ID" -RouteCancelledRuns && pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/watchdog-automations.ps1 -ApiUrl "$CEZ_API_URL" -ProjectId "$CEZ_PROJECT_ID" -MaxRunMinutes 240 -Workflow factory-plan,factory-review,factory-investigate -ExcludeRunId "$CEZ_TASK_ID"; else echo "watchdog skipped: Cezar API is not reachable from this run"; fi'
    timeoutSeconds: 120
  # Independent deterministic housekeeping runs before the bounded classification
  # agent so an agent failure cannot suppress either maintenance task.
  # GitHub only honours "Closes #N" on the default branch, and Factory PRs merge into dev, so this
  # step is what reflects delivered work on the issue tracker.
  - id: sync-issue-delivery
    name: Show PR progress on issues and close those delivered by PRs merged into dev
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/sync-issue-delivery.ps1 -OutputPath .factory/sync-issue-delivery.json
    timeoutSeconds: 300
  # Event intake handles new issues immediately. This one-item pull catches
  # existing issues whose event was missed or predated the automation cursor.
  - id: intake-select
    name: Select one oldest eligible existing intake issue
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/select-intake-issue.ps1 -OutputPath .factory/intake-issue.json
    timeoutSeconds: 300
  - id: intake-classify
    name: Classify the selected existing intake issue
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/classify-intake.ps1 -InputPath .factory/intake-issue.json -OutputPath .factory/intake-result.json
    timeoutSeconds: 300
  - id: intake-validate
    name: Validate the intake result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-intake-or-no-work.ps1 -Path .factory/intake-result.json
    timeoutSeconds: 60
  - id: intake-route
    name: Route the selected issue to planning
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-intake-or-no-work.ps1 -Path .factory/intake-result.json
    timeoutSeconds: 300
  - id: refresh-stale-workable
    name: Refresh at most two stale workable issues
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/refresh-stale-workable.ps1 -Limit 1 -OutputPath .factory/stale-workable-refresh.json
    timeoutSeconds: 300
  - id: repository-maintenance
    name: Run deterministic repository maintenance
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/maintain-repository.ps1 -OutputPath .factory/repository-maintenance.json
    timeoutSeconds: 300
  # Last deterministic step: check every open issue against policies/lifecycle.json (one state, an owner,
  # inside its deadline), repair what is mechanical, and keep the "Factory stall report" issue current.
  - id: lifecycle-sweep
    name: Check every open issue against the lifecycle policy
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/sweep-lifecycle.ps1 -OutputPath .factory/lifecycle-sweep.json
    timeoutSeconds: 300
  - id: audit-shadow-copies
    name: Audit registered project Factory shadows without modifying targets
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/audit-shadow-copies.ps1 -RepositoryRoot $FACTORY_RUNTIME_ROOT -ReceiptPath .factory/release-reports/shadow-audit.json
    timeoutSeconds: 300
  - id: recover-audit-reservations
    name: Release expired backlog-label audit reservations
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/recover-audit-reservations.ps1 -OutputPath .factory/audit-reservation-recovery.json
    timeoutSeconds: 300
  # A housekeeping run has nothing to commit. The backlog label audit agent (retired: the lifecycle sweep and
  # intake cover it, and it made the run depend on the model limit) once committed, pushed and opened pull
  # requests itself every hour; this fails the run if that ever returns. (Cezar's own end-of-run autosave
  # happens after the last step and is handled by .gitignore, not here.)
  - id: no-run-commits
    name: Verify the run made no commit
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/assert-no-run-commits.ps1 -OutputPath .factory/run-commits.json
    timeoutSeconds: 60
