name: factory-maintenance
description: Scheduled bounded Factory housekeeping with one existing-issue intake, stale-workable refresh, and repository sweep.
steps:
  - id: startup
    name: Prepare workflow environment
    # Runs inside Cezar's Linux container. FACTORY_RUNTIME_ROOT is the mounted
    # container checkout, not a Windows host path.
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-maintenance -Step housekeeping -RequireGh -RequiredScripts watchdog-automations.ps1,sync-issue-delivery.ps1,select-intake-issue.ps1,classify-intake.ps1,validate-intake-or-no-work.ps1,route-intake-or-no-work.ps1,validate-result.ps1,route-state.ps1,recover-audit-reservations.ps1,audit-backlog-labels.ps1,validate-backlog-label-audit-input.ps1,apply-backlog-label-audit.ps1,refresh-stale-workable.ps1,maintain-repository.ps1,gh-cache.ps1,audit-shadow-copies.ps1,probe-model-endpoint.ps1
    timeoutSeconds: 60
  # Liveness backstop first, so it runs even if a later step hangs: this hourly run cancels any earlier
  # run of a bounded workflow (including a previous stuck maintenance run) that outlived 30 minutes,
  # and returns its issue to factory:investigate. Command steps have their own deadlines; this covers
  # a stuck agent step. It never cancels the run it belongs to.
  - id: watchdog
    name: Cancel bounded Factory runs that outlived their liveness budget
    command: 'if [ -n "$CEZ_API_URL" ] && [ -n "$CEZ_PROJECT_ID" ]; then pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/watchdog-automations.ps1 -ApiUrl "$CEZ_API_URL" -ProjectId "$CEZ_PROJECT_ID" -MaxRunMinutes 30 -Workflow factory-maintenance,factory-intake,factory-health,factory-environment-analysis -ExcludeRunId "$CEZ_TASK_ID" -RouteCancelledRuns; else echo "watchdog skipped: Cezar API is not reachable from this run"; fi'
    timeoutSeconds: 120
  # Independent deterministic housekeeping runs before the bounded classification
  # agent so an agent failure cannot suppress either maintenance task.
  # GitHub only honours "Closes #N" on the default branch, and Factory PRs merge into dev, so this
  # step is what reflects delivered work on the issue tracker.
  - id: sync-issue-delivery
    name: Show PR progress on issues and close those delivered by PRs merged into dev
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/sync-issue-delivery.ps1 -OutputPath .factory/sync-issue-delivery.json
    timeoutSeconds: 300
  # Event intake handles new issues immediately. This one-item pull catches
  # existing issues whose event was missed or predated the automation cursor.
  - id: intake-select
    name: Select one oldest eligible existing intake issue
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/select-intake-issue.ps1 -OutputPath .factory/intake-issue.json
    timeoutSeconds: 300
  - id: intake-classify
    name: Classify the selected existing intake issue
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/classify-intake.ps1 -InputPath .factory/intake-issue.json -OutputPath .factory/intake-result.json
    timeoutSeconds: 300
  - id: intake-validate
    name: Validate the intake result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-intake-or-no-work.ps1 -Path .factory/intake-result.json
    timeoutSeconds: 60
  - id: intake-route
    name: Route the selected issue to planning
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-intake-or-no-work.ps1 -Path .factory/intake-result.json
    timeoutSeconds: 300
  - id: refresh-stale-workable
    name: Refresh at most two stale workable issues
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/refresh-stale-workable.ps1 -OutputPath .factory/stale-workable-refresh.json
    timeoutSeconds: 300
  - id: repository-maintenance
    name: Run deterministic repository maintenance
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/maintain-repository.ps1 -OutputPath .factory/repository-maintenance.json
    timeoutSeconds: 300
  - id: audit-shadow-copies
    name: Audit registered project Factory shadows without modifying targets
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/audit-shadow-copies.ps1 -RepositoryRoot $FACTORY_RUNTIME_ROOT -ReceiptPath .factory/release-reports/shadow-audit.json
    timeoutSeconds: 300
  - id: recover-audit-reservations
    name: Release expired backlog-label audit reservations
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/recover-audit-reservations.ps1 -OutputPath .factory/audit-reservation-recovery.json
    timeoutSeconds: 300
  - id: backlog-label-audit-collect
    name: Collect bounded backlog-label audit input
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/audit-backlog-labels.ps1 -OutputPath .factory/backlog-label-audit-input.json
    timeoutSeconds: 300
  - id: backlog-label-audit-validate
    name: Validate bounded backlog-label audit handoff
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-backlog-label-audit-input.ps1 -Path .factory/backlog-label-audit-input.json -MaxCandidates 3
    timeoutSeconds: 60
  - id: backlog-label-audit-prepare
    name: Apply deterministic classifications and reserve candidates
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/apply-backlog-label-audit.ps1 -InputPath .factory/backlog-label-audit-input.json -Prepare -WorkflowContract -OutputPath .factory/backlog-label-audit-preparation.json
    timeoutSeconds: 300
    outputSchema:
      type: object
      required: [status, candidateCount, resolvedCount]
      properties:
        status: { type: string, const: prepared }
        candidateCount: { type: integer, minimum: 0, maximum: 3 }
        resolvedCount: { type: integer, minimum: 0 }
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action: { type: string, const: no_work }
            reasonCode: { type: string, const: no_work }
          additionalProperties: false
      allOf:
        - if: { properties: { candidateCount: { const: 0 } }, required: [candidateCount] }
          then: { required: [$cezar] }
        - if: { properties: { candidateCount: { minimum: 1 } }, required: [candidateCount] }
          then: { not: { required: [$cezar] } }
      additionalProperties: false
  # Probe the model only here, immediately before the one agent step. Every earlier step is deterministic
  # housekeeping (the stuck-run watchdog, intake routing, stale-issue recovery) and must keep running during a
  # model outage, which is exactly when it is needed.
  - id: model-check
    name: Fail fast when the model host cannot generate
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/probe-model-endpoint.ps1
    timeoutSeconds: 300
  - id: backlog-label-audit
    name: Audit at most three legacy issues
    skill: factory-backlog-label-audit
    prompt: |
      {{task}}

      Apply only the bounded legacy-label policy in the Factory Backlog Label Audit skill.
      The workflow already ran the read-only collector, `audit-backlog-labels.ps1`, exactly once,
      validated the bounded input, and applied deterministic legacy-label classifications and
      audit reservations through the preparation consumer.
      Do not run it or any other Factory script, retrieve issue bodies, call `gh issue list`, or
      manually select issues. Read only the worktree-local `.factory/backlog-label-audit-input.json`
      artifact. The resolved entries have already been applied and verified; evaluate only the
      remaining candidates, which are capped at three. Write a candidate-only proposal to
      `.factory/backlog-label-audit.json`. Set `considered` to the exact candidate `number` values.
      Put every candidate exactly once across `changed` and `skipped`; use the field `issue` with
      that candidate's number in each outcome (not `number`). Every outcome must include `added`
      with its proposed allowlisted closing labels and `reason` with a concise rationale. Do not
      omit an outcome when skipping a candidate; skipped outcomes also require a durable closing
      Factory state label.
      Do not read or mutate GitHub state. The following deterministic workflow step validates the
      proposal and applies effects after checking the live issue state and audit reservation.
  - id: backlog-label-audit-apply
    name: Validate and apply backlog-label proposals
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/apply-backlog-label-audit.ps1 -InputPath .factory/backlog-label-audit-input.json -PreparationPath .factory/backlog-label-audit-preparation.json -ProposalPath .factory/backlog-label-audit.json -OutputPath .factory/backlog-label-audit-application.json
    timeoutSeconds: 300
