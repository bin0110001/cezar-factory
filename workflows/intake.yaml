name: factory-intake
description: Classify a newly opened issue, then route it to planning or genuine-question help
steps:
  - id: select-issue
    name: Select one existing issue for intake
    command: pwsh -NoProfile -File /projects/cezar-factory/scripts/select-intake-issue.ps1 -OutputPath .factory/intake-issue.json
  - id: intake
    name: Classify selected existing issue
    skill: factory-intake
    prompt: |
      Read the selector result from .factory/intake-issue.json.
      The selector has already performed the only issue discovery step.
      If its `issue` is null, report that no eligible existing issue was found
      and stop. Otherwise classify exactly the selected issue from that result:
      {{task}}

      Write the structured intake result to .factory/intake-result.json.
      Include the issue number. Do not edit factory:* labels.
  - id: validate
    name: Validate intake result
    command: pwsh -NoProfile -File "$FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1" -Kind intake -Path .factory/intake-result.json
    onFail:
      retry: intake
      max: 1
  - id: route
    name: Route intake to planning
    command: pwsh -NoProfile -File "$FACTORY_RUNTIME_ROOT/scripts/route-state.ps1" -Event intake-result -Path .factory/intake-result.json
