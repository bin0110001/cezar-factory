name: factory-intake
description: Classify a newly opened issue, then route it to planning or genuine-question help
steps:
  - id: intake
    name: Classify newly opened issue
    skill: factory-intake
    prompt: |
      Classify this newly opened GitHub issue: {{task}}

      Write the structured intake result to .factory/intake-result.json.
      Include the issue number. Do not edit factory:* labels.
  - id: validate
    name: Validate intake result
    command: pwsh -NoProfile -File "$FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1" -Kind intake -Path .factory/intake-result.json
    onFail:
      retry: intake
      max: 1
  - id: route
    name: Route intake to planning
    command: pwsh -NoProfile -File "$FACTORY_RUNTIME_ROOT/scripts/route-state.ps1" -Event intake-result -Path .factory/intake-result.json
