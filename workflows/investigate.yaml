name: factory-investigate
description: Classify repeated failures, then retry (factory:ready) or escalate (factory:needs-help)
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-investigate -Step recall -RequireGh -RequiredScripts check-already-resolved.ps1,hindsight/recall.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
  - id: recall
    name: Create bounded memory-recall artifact
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/hindsight/recall.ps1 -Objective "{{task}}" -TaskClass investigation
  - id: investigate
    name: Run factory-investigate skill
    skill: factory-investigate
    prompt: |
      Investigate repeated failures on this GitHub issue: {{task}}

      If `.factory/already-resolved.json` exists, the issue is already resolved: reply with one
      line saying so and stop. Do not inspect the repository, edit anything, or write a result file.

      Read `.factory/context/memory-recall.json` when present; record a real recall miss when unavailable.
      Read compact evidence only (issue comments, PR checks, artifact summaries under scripts/artifacts or
      .factory/); do not paste full logs. Do not modify code. Write the structured result as JSON to
      .factory/investigate-result.json (create the directory) with the issue number in "issue".
  - id: validate
    name: Validate investigation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind investigation -Path .factory/investigate-result.json
    onFail:
      retry: investigate
      max: 1
  - id: route
    name: Route to retry or needs-help
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event investigate-result -Path .factory/investigate-result.json
    onFail:
      retry: validate
      max: 1
