name: factory-investigate
description: Classify repeated failures, then retry (factory:ready) or escalate (factory:needs-help)
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-investigate -Step recall -RequireGh -RequiredScripts check-already-resolved.ps1,hindsight/recall.ps1,validate-result.ps1,route-state.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
    outputSchema:
      type: object
      required: [status, issue]
      properties:
        status: { type: string, enum: [open, already-resolved] }
        issue: { type: integer }
        reason: { type: string }
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action: { type: string, const: no_work }
            reasonCode: { type: string, const: no_work }
          additionalProperties: false
      additionalProperties: false
  - id: recall
    name: Create bounded memory-recall artifact
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/hindsight/recall.ps1 -Objective "{{task}}" -TaskClass investigation
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties:
            resolved:
              type: object
              required: [status]
              properties: { status: { const: open } }
  - id: investigate
    name: Run factory-investigate skill
    skill: factory-investigate
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties:
            resolved:
              type: object
              required: [status]
              properties: { status: { const: open } }
    prompt: |
      Investigate repeated failures on this GitHub issue: {{task}}

      Read `.factory/context/memory-recall.json` when present; record a real recall miss when unavailable.
      Read compact evidence only (issue comments, PR checks, artifact summaries under scripts/artifacts or
      .factory/); do not paste full logs. Do not modify code. Write the structured result as JSON to
      .factory/investigate-result.json (create the directory), copying the numeric issue number from the
      task into the required integer "issue" field.
  - id: validate
    name: Validate investigation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind investigation -Path .factory/investigate-result.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties:
            resolved:
              type: object
              required: [status]
              properties: { status: { const: open } }
    onFail:
      retry: investigate
      max: 1
      retryOn: [1]
    failureReasons:
      "1": malformed_result
      "10": configuration
  - id: route
    name: Route to retry or needs-help
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event investigate-result -Path .factory/investigate-result.json
    failureReasons:
      "1": unknown
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties:
            resolved:
              type: object
              required: [status]
              properties: { status: { const: open } }
