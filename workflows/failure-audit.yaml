name: factory-failure-audit
description: Daily bounded, read-only collection of recent Cezar failures
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-failure-audit -Step collect -RequiredScripts audit-factory-failures.ps1
  - id: collect
    name: Collect bounded failure evidence
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/audit-factory-failures.ps1 -OutputPath .factory/failure-audit-input.json
