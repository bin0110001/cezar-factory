name: factory-implement
description: Prepare a ready issue, implement it, run verification, PR, then factory:review
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-implement -Step prepare -RequireGh -RequiredScripts check-already-resolved.ps1,prepare-implementation.ps1,materialize-workflow-output.ps1,ensure-implementation-result.ps1,route-state.ps1,validate-result.ps1,ensure-pr-closes-issue.ps1,lib.ps1,factory/test-changed.ps1,factory/test-full.ps1,factory/verify.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
    outputSchema:
      type: object
      required: [status, issue]
      properties:
        status: { type: string, enum: [open, already-resolved] }
        issue: { type: integer }
        reason: { type: string }
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action: { type: string, const: no_work }
            reasonCode: { type: string, const: no_work }
          additionalProperties: false
      additionalProperties: false
  - id: prepare
    name: Prepare issue and environment context
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/prepare-implementation.ps1 -Task "{{task}}" -OutputPath .factory/implementation-context.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: start
    name: Move issue to factory:working
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event start -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: implement
    name: Run factory-implement skill
    skill: factory-implement
    outputSchema:
      type: object
      required: [status, summary, filesChanged, testsRun, testResult, acceptanceCriteriaStatus, knownConcerns, followUpSuggestions, durableKnowledgeCandidates, documentationUpdated]
      properties:
        status: { type: string, enum: [success, failure] }
        summary: { type: string }
        filesChanged: { type: array, items: { type: string } }
        testsRun: { type: array, items: { type: string } }
        testResult: { type: string }
        acceptanceCriteriaStatus: { type: string }
        documentationUpdated: { type: boolean }
        knownConcerns: { type: string }
        followUpSuggestions: { type: string }
        durableKnowledgeCandidates: { type: string }
        pr: { type: string }
      additionalProperties: false
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    prompt: |
      {{task}}
  - id: materialize-result
    name: Materialize the validated implementation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/materialize-workflow-output.ps1 -OutputKey implement -Path .factory/implement-result.json -ExpectedIssuePath .factory/implementation-context.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved, implement]
          properties:
            resolved: { type: object, required: [status], properties: { status: { const: open } } }
            implement: { type: object }
  - id: ensure-pr-closes-issue
    name: Ensure successful PR closes the issue on merge
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-pr-closes-issue.ps1 -Path .factory/implement-result.json
    outputSchema:
      type: object
      required: [status, issue, pr, action, observedRevision]
      properties:
        status: { type: string, enum: [linked, already-linked, reconciled] }
        issue: { type: integer, minimum: 1 }
        pr: { type: string, minLength: 1 }
        observedRevision: { type: string, minLength: 1 }
        action:
          type: object
          required: [schemaVersion, target, expectedRevision, operation, arguments, rationale, operationKey]
          properties:
            schemaVersion: { type: integer, const: 1 }
            target:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, const: pull_request }
                id: { type: string, minLength: 1 }
              additionalProperties: false
            expectedRevision: { type: string, minLength: 1 }
            operation: { type: string, const: pull_request.closing_reference.ensure }
            arguments:
              type: object
              required: [issue, reference]
              properties:
                issue: { type: integer, minimum: 1 }
                reference: { type: string, minLength: 1 }
              additionalProperties: false
            rationale: { type: string, minLength: 1 }
            operationKey: { type: string, minLength: 1 }
          additionalProperties: false
      additionalProperties: false
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: targeted-tests
    name: Run targeted tests
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-changed.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 2
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: full-verification
    name: Run required verification
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-full.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: verify-project
    name: Verify project integration
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/verify.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: validate
    name: Validate implementation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind implementation -Path .factory/implement-result.json -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
      retryOn: [1]
    failureReasons:
      "1": malformed_result
      "10": configuration
  - id: recover-implementation-contract-failure
    name: Preserve malformed implementation handoff as a typed failure
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-implementation-result.ps1 -Path .factory/implement-result.json -ContextPath .factory/implementation-context.json -FinalizationRecovery
    finalizer: true
    idempotent: true
    timeoutSeconds: 20
  - id: route-finalize
    name: Route only completed or contract-failed implementation outcomes
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event implement-finalize -Path .factory/implement-result.json
    finalizer: true
    idempotent: true
    timeoutSeconds: 30
