name: factory-implement
description: Prepare a ready issue, implement and validate with bounded same-session repair, publish only after checks pass, then own the PR through merge to dev
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-implement -Step prepare -RequireGh -RequiredScripts check-already-resolved.ps1,prepare-implementation.ps1,route-state.ps1,validate-result.ps1,ensure-implementation-result.ps1,ensure-pr-closes-issue.ps1,adaptive-progress-step.ps1,adaptive-repair-decision-step.ps1,repair-loop-step.ps1,lib.ps1,factory/protect-governance.ps1,factory/test-changed.ps1,factory/verify.ps1,probe-model-endpoint.ps1,check-weakening.ps1,collect-godot-dependencies.ps1
    timeoutSeconds: 60
  - id: model-check
    name: Fail fast when the model host cannot generate
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/probe-model-endpoint.ps1
    timeoutSeconds: 300
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
    timeoutSeconds: 60
  - id: prepare
    name: Prepare issue and environment context
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/prepare-implementation.ps1 -Task "{{task}}" -OutputPath .factory/implementation-context.json
    timeoutSeconds: 300
  - id: collect-godot-dependencies
    name: Collect conservative Godot dependency context
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/collect-godot-dependencies.ps1 -Optional -OutputPath .factory/godot-dependencies.json
    timeoutSeconds: 300
  - id: start
    name: Move issue to factory:working
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event start -Task "{{task}}"
    timeoutSeconds: 300
  - id: implement
    name: Run factory-implement skill
    skill: factory-implement
    adaptiveRepair:
      checkSteps: [protect-governance, weakening-guard, targeted-tests, verify-project, workspace-preflight]
      decisionStep: repair-decision
      checksPath: .factory/verification-checks.json
      decisionPath: .factory/adaptive-repair-decision.json
      completionPrompt: |
        The required validation matrix passed for the current artifact. Open or update the pull
        request targeting dev, include Closes #N for every issue fully delivered, and write the
        structured success result to .factory/implement-result.json. Preserve the same issue,
        branch, worktree, and session. Do not rerun validation or claim checks that did not pass.
    prompt: |
      Implement this GitHub issue: {{task}}

      If `.factory/already-resolved.json` exists, the issue is already resolved: reply with one
      line saying so and stop. Do not inspect the repository, edit anything, or write a result file.

      Before editing code, read the prepared .factory/implementation-context.json
      artifact, the nearest AGENTS.md/manual, and the issue body/comments recorded
      there. The issue and approved plan are the source of truth. Do not repeat
      broad discovery, use anonymous GitHub curl calls, guess repositories, or
      dispatch a child Cezar task.

      When present, `.factory/godot-dependencies.json` is conservative impact context.
      Treat entries in `uncertain` as unknown dependencies and inspect those areas
      directly; the graph does not select or skip tests.

      The workflow already prepared the context and moved the issue to factory:working.
      Do not run Factory lifecycle, routing, or preparation scripts and do not set any
      factory:* label. Use only the current worktree. If a command fails, inspect its
      actual error and retry once with corrected syntax. Prefer structured file edits
      over shell heredocs or nested quoting for multiline files. If the corrected
      command also fails, or two consecutive calls are spent recovering the same
      command failure, stop implementation and end with CEZ:DONE so the workflow can
      record an incomplete handoff; do not switch
      shells, invent paths, recursively list directories, or delete/recreate files.
      When the code change is ready, end the turn with CEZ:DONE. Do not open or update a PR and
      do not write .factory/implement-result.json; the workflow runs the required checks first
      and will call this same session again to publish only after they pass.
  - id: protect-governance
    name: Guard verification governance from agent changes
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/protect-governance.ps1 -Task "{{task}}"
    timeoutSeconds: 300
    continueOnFailure: true
  - id: weakening-guard
    name: Fail when the change weakens mandatory checks, thresholds or protected paths
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-weakening.ps1 -BaseRef origin/dev
    timeoutSeconds: 120
    continueOnFailure: true
  - id: targeted-tests
    name: Run targeted tests
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-changed.ps1 -Task "{{task}}"
    timeoutSeconds: 1800
    continueOnFailure: true
  - id: verify-project
    name: Verify project integration
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/verify.ps1 -Task "{{task}}"
    timeoutSeconds: 1800
    continueOnFailure: true
  - id: workspace-preflight
    name: Preflight the issue branch against the integration target
    command: 'if [ -n "$FACTORY_FENCING_TOKEN" ]; then cez workspace preflight --issue "$FACTORY_ISSUE" --json; fi'
    timeoutSeconds: 300
    continueOnFailure: true
  - id: repair-progress
    name: Evaluate verified progress for this validation round
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/adaptive-progress-step.ps1 -InputPath .factory/verification-checks.json -OutputPath .factory/progress-evaluation.json
    timeoutSeconds: 60
    continueOnFailure: true
  - id: repair-policy
    name: Apply the bounded repair policy
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/repair-loop-step.ps1 -ReceiptsPath .factory/verification-checks.json -ProgressPath .factory/progress-evaluation.json -OutputPath .factory/repair-policy-decision.json -LedgerPath .factory/adaptive-repair-ledger.json -Workflow factory-implement -Validator adaptive-matrix
    timeoutSeconds: 300
    continueOnFailure: true
  - id: repair-decision
    name: Apply bounded repair policy and decide whether to continue
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/adaptive-repair-decision-step.ps1 -ChecksPath .factory/verification-checks.json -ProgressPath .factory/progress-evaluation.json -PolicyDecisionPath .factory/repair-policy-decision.json -OutputPath .factory/adaptive-repair-decision.json
    timeoutSeconds: 60
    adaptiveRepairDecision: true
    continueOnFailure: true
  - id: ensure-result
    name: Preserve implementation handoff
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-implementation-result.ps1 -Path .factory/implement-result.json -ContextPath .factory/implementation-context.json
    timeoutSeconds: 60
  - id: ensure-pr-closes-issue
    name: Ensure successful PR closes the issue on merge
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-pr-closes-issue.ps1 -Path .factory/implement-result.json
    timeoutSeconds: 300
  - id: validate
    name: Validate implementation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind implementation -Path .factory/implement-result.json
    timeoutSeconds: 60
  - id: route
    name: Set factory:review
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event implement-result -Path .factory/implement-result.json
    timeoutSeconds: 300
    onFail:
      retry: validate
      max: 1
  - id: lifecycle-ready
    name: Mark the completed coding phase ready for review and integration
    command: 'if [ -n "$FACTORY_FENCING_TOKEN" ]; then cez workspace handoff --run "$CEZ_TASK_ID" --fence "$FACTORY_FENCING_TOKEN"; fi'
    timeoutSeconds: 300
    onFail:
      retry: route
      max: 1
