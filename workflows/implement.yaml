name: factory-implement
description: Prepare a ready issue, implement it, run verification, PR, then factory:review
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-implement -Step prepare -RequireGh -RequiredScripts check-already-resolved.ps1,prepare-implementation.ps1,route-state.ps1,validate-result.ps1,ensure-implementation-result.ps1,ensure-pr-closes-issue.ps1,lib.ps1,factory/test-changed.ps1,factory/test-full.ps1,factory/verify.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
    outputSchema:
      type: object
      required: [status, issue]
      properties:
        status: { type: string, enum: [open, already-resolved] }
        issue: { type: integer }
        reason: { type: string }
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action: { type: string, const: no_work }
            reasonCode: { type: string, const: no_work }
          additionalProperties: false
      additionalProperties: false
  - id: prepare
    name: Prepare issue and environment context
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/prepare-implementation.ps1 -Task "{{task}}" -OutputPath .factory/implementation-context.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: start
    name: Move issue to factory:working
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event start -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: implement
    name: Run factory-implement skill
    skill: factory-implement
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    prompt: |
      Implement this GitHub issue: {{task}}

      If `.factory/already-resolved.json` exists, the issue is already resolved: reply with one
      line saying so and stop. Do not inspect the repository, edit anything, or write a result file.

      Before editing code, read the prepared .factory/implementation-context.json
      artifact, the nearest AGENTS.md/manual, and the issue body/comments recorded
      there. The issue and approved plan are the source of truth. Do not repeat
      broad discovery, use anonymous GitHub curl calls, guess repositories, or
      dispatch a child Cezar task.

      The workflow already prepared the context and moved the issue to factory:working.
      Do not run Factory lifecycle, routing, or preparation scripts and do not set any
      factory:* label. Use only the current worktree. If a command fails, inspect its
      actual error and retry once with corrected syntax. Prefer structured file edits
      over shell heredocs or nested quoting for multiline files. If the corrected
      command also fails, or two consecutive calls are spent recovering the same
      command failure, stop and write a failure result immediately; do not switch
      shells, invent paths, recursively list directories, or delete/recreate files.
      When done, open or update the PR, then write the structured
      result as JSON to .factory/implement-result.json (create the directory) with the
      issue number in "issue" and the PR URL in "pr".
  - id: ensure-result
    name: Preserve implementation handoff
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-implementation-result.ps1 -Path .factory/implement-result.json -ContextPath .factory/implementation-context.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
  - id: ensure-pr-closes-issue
    name: Ensure successful PR closes the issue on merge
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/ensure-pr-closes-issue.ps1 -Path .factory/implement-result.json
  - id: targeted-tests
    name: Run targeted tests
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-changed.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 2
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: full-verification
    name: Run required verification
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-full.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: verify-project
    name: Verify project integration
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/verify.ps1 -Task "{{task}}"
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "10": configuration
      "11": missing_command
      "12": authentication
      "13": provider_unavailable
      "14": provider_quota
      "15": transient_transport
      "16": timeout
      "17": malformed_result
      "18": unknown
  - id: validate
    name: Validate implementation result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind implementation -Path .factory/implement-result.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: implement
      max: 1
  - id: route
    name: Set factory:review
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event implement-result -Path .factory/implement-result.json
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [resolved]
          properties: { resolved: { type: object, required: [status], properties: { status: { const: open } } } }
    onFail:
      retry: validate
      max: 1
