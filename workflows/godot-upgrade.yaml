name: factory-godot-upgrade
description: Adopt a newly released stable Godot in one project - pin it on a branch, run the project's Godot tests, let the agent fix regressions, then open an auto-merge PR. Needs no image rebuild or container restart.
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-godot-upgrade -Step check -RequireGh -RequiredScripts godot-upgrade.ps1
  - id: check
    name: Look for a newer stable Godot release
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step check
    outputSchema:
      type: object
      required: [status, from, to, reason]
      properties:
        status: { type: string, enum: [none, upgrade] }
        from: { type: string }
        to: { type: string }
        reason: { type: string }
        branch: { type: string }
        godotBin: { type: string }
      additionalProperties: false
  - id: stage
    name: Install the new Godot version
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step stage
    when: &upgradeCondition
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [check]
          properties:
            check:
              type: object
              required: [status]
              properties: { status: { const: upgrade } }
  - id: apply
    name: Pin the new version on an upgrade branch
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step apply
    when: *upgradeCondition
  - id: baseline-tests
    name: Run the project's Godot tests on the new version
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step test -AllowFailure
    when: *upgradeCondition
    outputSchema:
      type: object
      required: [step, status, passed, category, exitCode, log]
      properties:
        step: { type: string, const: test }
        status: { type: string, enum: [passed, failed, unavailable] }
        passed: { type: boolean }
        category: { type: string, enum: [none, test_regression, missing_command, unknown] }
        exitCode: { type: integer }
        log: { type: string }
      additionalProperties: false
    failureReasons:
      "1": test_regression
      "4": missing_command
      "10": unknown
  - id: fix
    name: Fix regressions caused by the new Godot version
    skill: factory-godot-upgrade
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [check, baseline-tests]
          properties:
            check:
              type: object
              required: [status]
              properties: { status: { const: upgrade } }
            baseline-tests:
              type: object
              required: [passed, category]
              properties:
                passed: { const: false }
                category: { const: test_regression }
    prompt: |
      {{task}}

      The workflow already looked for a new Godot release, installed it, pinned it on the
      upgrade branch, and ran the project's tests. Do not run any Factory script and do not
      look for releases, create branches, or open pull requests yourself.

      The workflow has already confirmed a new stable upgrade and that baseline tests fail on
      it. Follow the Factory Godot Upgrade skill to fix the regression. Do not run Factory
      scripts, look for releases, create branches, or open pull requests.
  - id: tests
    name: Re-run the project's Godot tests
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step test
    when:
      type: object
      required: [outputs]
      properties:
        outputs:
          type: object
          required: [check, baseline-tests]
          properties:
            check:
              type: object
              required: [status]
              properties: { status: { const: upgrade } }
            baseline-tests:
              type: object
              required: [passed, category]
              properties:
                passed: { const: false }
                category: { const: test_regression }
    outputSchema:
      type: object
      required: [step, status, passed, category, exitCode, log]
      properties:
        step: { type: string, const: test }
        status: { type: string, enum: [passed, failed, unavailable] }
        passed: { type: boolean }
        category: { type: string, enum: [none, test_regression, missing_command, unknown] }
        exitCode: { type: integer }
        log: { type: string }
      additionalProperties: false
    onFail:
      retry: fix
      max: 2
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "4": missing_command
      "10": unknown
  - id: publish
    name: Open the upgrade pull request with auto-merge
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/godot-upgrade.ps1 -Step publish
    when:
      type: object
      anyOf:
        - properties:
            outputs:
              type: object
              required: [check, baseline-tests]
              properties:
                check:
                  type: object
                  required: [status]
                  properties: { status: { const: upgrade } }
                baseline-tests:
                  type: object
                  required: [passed, category]
                  properties:
                    passed: { const: true }
                    category: { const: none }
        - properties:
            outputs:
              type: object
              required: [check, tests]
              properties:
                check:
                  type: object
                  required: [status]
                  properties: { status: { const: upgrade } }
                tests:
                  type: object
                  required: [passed, category]
                  properties:
                    passed: { const: true }
                    category: { const: none }
