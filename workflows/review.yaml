name: factory-review
description: Independent review of the PR - findings posted, routed to changes-requested or human-review
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-review -Step review -RequireGh -RequiredScripts check-already-resolved.ps1,validate-result.ps1,verify-merge-eligibility.ps1,route-state.ps1,lib.ps1,factory/test-full.ps1,factory/verify.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
  - id: full-verification
    name: Run required project suite
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-full.ps1 -Task "{{task}}"
  - id: verify-project
    name: Verify project integration
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/verify.ps1 -Task "{{task}}"
  - id: review
    name: Run factory-review skill
    skill: factory-review
    # Each Cezar run starts a fresh session in its own worktree, so the reviewer never shares the implementer's context.
    prompt: |
      Review the pull request for this GitHub issue: {{task}}

      If `.factory/already-resolved.json` exists, the issue is already resolved: reply with one
      line saying so and stop. Do not inspect the repository, edit anything, or write a result file.

      Do not modify code. Write the structured review result as JSON to .factory/review-result.json
      (create the directory) with the issue number in "issue", the exact PR URL, the 40-character PR head SHA you
      reviewed as "reviewedHeadSha", and your reviewer identity (runner/model) as "reviewerIdentity". Do not run Factory scripts or edit factory:* labels; the
      workflow posts findings and routes state.
  - id: validate
    name: Validate review result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind review -Path .factory/review-result.json
    onFail:
      retry: review
      max: 1
      retryOn: [1]
    failureReasons:
      "1": malformed_result
      "10": configuration
  - id: merge-eligibility
    name: Verify live PR, review, validation and repository gates
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/verify-merge-eligibility.ps1 -ReviewPath .factory/review-result.json -OutputPath .factory/merge-eligibility.json
  - id: route
    name: Post findings and set factory state
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event review-result -Path .factory/review-result.json -GatePath .factory/merge-eligibility.json
    onFail:
      retry: validate
      max: 1
