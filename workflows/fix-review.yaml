name: factory-fix-review
description: Address actionable review findings, re-validate, and return the issue to factory:review
steps:
  - id: startup
    name: Prepare workflow environment
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory-startup.ps1 -Workflow factory-fix-review -Step start -RequireGh -RequiredScripts check-already-resolved.ps1,route-state.ps1,validate-result.ps1,factory/test-changed.ps1,factory/run-verification.ps1
  - id: resolved
    name: Finish early when the issue is already resolved
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/check-already-resolved.ps1 -Task "{{task}}"
    outputSchema:
      type: object
      required: [status, issue]
      properties:
        status: { type: string, enum: [open, already-resolved] }
        issue: { type: integer }
        reason: { type: string }
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action: { type: string, const: no_work }
            reasonCode: { type: string, const: no_work }
          additionalProperties: false
      allOf:
        - if: { properties: { status: { const: already-resolved } }, required: [status] }
          then: { required: [$cezar] }
      additionalProperties: false
  - id: start
    name: Move issue to factory:working
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event start -Task "{{task}}"
  - id: fix
    name: Run factory-fix skill
    skill: factory-fix
    prompt: |
      Address the review findings on this GitHub issue's PR: {{task}}

      If `.factory/already-resolved.json` exists, the issue is already resolved: reply with one
      line saying so and stop. Do not inspect the repository, edit anything, or write a result file.

      The workflow already moved the issue to factory:working. Do not run Factory lifecycle or routing
      scripts and do not edit factory:* labels. Read only the latest review comment's blocking findings.
      Push fixes to the existing PR, then write the structured result as JSON to .factory/implement-result.json
      (create the directory) with the issue number in "issue" and the PR URL in "pr".
  - id: targeted-tests
    name: Run targeted validation
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/factory/test-changed.ps1
    outputSchema:
      type: object
      required: [status, level, reason]
      properties:
        status:
          type: string
          enum: [passed, failed, skipped, unavailable, no_matching_tests]
        level:
          type: string
          enum: [targeted, full]
        reason:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        category:
          type: string
          enum: [work_verdict, test_regression, configuration, missing_command, authentication, provider_unavailable, provider_quota, transient_transport, timeout, cancelled, malformed_result, unknown]
        $cezar:
          type: object
          required: [action, reasonCode]
          properties:
            action:
              type: string
              enum: [no_work, skip_step, blocked]
            reasonCode:
              type: string
              enum: [no_work, precondition_not_met, policy_blocked, dependency_unavailable, provider_quota, human_input_required]
          additionalProperties: false
    onFail:
      retry: fix
      max: 1
      retryOn: [1]
    failureReasons:
      "1": test_regression
      "2": configuration
      "3": timeout
      "4": missing_command
      "5": authentication
      "6": provider_unavailable
      "7": transient_transport
      "8": cancelled
      "9": malformed_result
      "10": unknown
  - id: validate
    name: Validate fix result
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/validate-result.ps1 -Kind implementation -Path .factory/implement-result.json -RouteOnFailure -Task "{{task}}"
    onFail:
      retry: fix
      max: 1
  - id: route
    name: Return issue to factory:review
    command: pwsh -NoProfile -File $FACTORY_RUNTIME_ROOT/scripts/route-state.ps1 -Event implement-result -Path .factory/implement-result.json
    onFail:
      retry: validate
      max: 1
