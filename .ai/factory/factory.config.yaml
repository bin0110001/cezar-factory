# Factory source checkout's explicit project validation commands.
factory:
  source: "cezar-factory"
  version: "0.3.48"

workflows:
  - implement
  - review

skills:
  - factory-implement
  - factory-review

project:
  type: powershell

validation:
  changed: "pwsh -NoProfile -File scripts/validate-automation-catalog.ps1"
  full: "if (-not (Test-Path 'cezar/node_modules/.package-lock.json') -or -not (Test-Path 'cezar/node_modules/tsx')) { Push-Location cezar; npm ci --no-audit --no-fund; $installExit = $LASTEXITCODE; Pop-Location; if ($installExit -ne 0) { throw 'Cezar dependencies required by the full Factory suite could not be installed.' } }; pwsh -NoProfile -File tests/run-tests.ps1"
  verify: "pwsh -NoProfile -File scripts/release/validate-release.ps1 -SkipTests -AllowUnreleasedVersion"
