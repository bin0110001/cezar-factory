# Project-owned factory configuration.
factory:
  source: "cezar-factory"
  version: "0.3.1"

workflows:
  - plan
  - implement
  - review
  - fix-review
  - investigate

skills:
  - factory-plan
  - factory-implement
  - factory-review
  - factory-fix
  - factory-investigate

features:
  knowledge_extraction: false
  maintenance: false

project:
  type: godot

validation:
  changed: "./scripts/factory/test-changed.ps1"
  full: "./scripts/factory/test-full.ps1"
  verify: "./scripts/factory/verify.ps1"
