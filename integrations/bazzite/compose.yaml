name: cezar-factory

x-langfuse-shared-environment: &langfuse-shared-environment
  NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT:-http://localhost:9090}
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_INGESTION_QUEUE_DELAY_MS: ${LANGFUSE_INGESTION_QUEUE_DELAY_MS:-}

services:
  cezar:
    image: ${CEZAR_IMAGE}
    env_file: .env
    environment:
      CEZ_AUTOMATIONS: ${CEZAR_AUTOMATIONS}
      CEZ_API_URL: ${CEZ_API_URL}
      # Enable only after the host release controller has staged verified channel pointers.
      CEZ_FACTORY_RELEASE_STORE: ${CEZ_FACTORY_RELEASE_STORE:-}
      FACTORY_RUNTIME_SOURCE_ROOT: ${FACTORY_RUNTIME_ROOT:-/projects/cezar-factory}
      # Cezar executes Factory workflows in Linux; this is the in-container
      # mount path, not a Windows host path.
      FACTORY_RUNTIME_ROOT: ${FACTORY_RUNTIME_ROOT:-/projects/cezar-factory}
      # Factory workflows and skills are loaded straight from the mounted checkout for every
      # project (a project's own .ai/ files still win by name), so a Factory update needs no
      # per-project copy. Updating the checkout is the only deployment step.
      CEZ_SHARED_WORKFLOWS_DIRS: ${FACTORY_RUNTIME_ROOT:-/projects/cezar-factory}/workflows
      CEZ_SHARED_SKILL_DIRS: ${FACTORY_RUNTIME_ROOT:-/projects/cezar-factory}/skills
    volumes:
      # Preserve the shared project checkouts; the Factory bind mount below
      # overlays only /projects/cezar-factory.
      - openhands-projects:/projects
      - ${FACTORY_RUNTIME_HOST_DIR}:/projects/cezar-factory:ro,Z
      # Cezar must update the controller's SQLite lease table so active runs stay protected from GC.
      - ${FACTORY_RELEASE_STORE_HOST_DIR:-/var/home/bin0110001/.local/share/cezar-factory/release-store}:/var/lib/cezar-factory/release-store:Z
      # The Factory checkout is immutable at runtime; Cezar still needs a
      # persistent writable home for run receipts and worktree metadata.
      - cezar-factory-runtime:/projects/cezar-factory/.ai/cezar:Z
      # Godot versions install on demand into this volume; a project pins one in .godot-version.
      - godot-versions:/opt/godot-versions
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  openhands:
    image: ${OPENHANDS_IMAGE}
    env_file: .env
    environment:
      AGENT_SERVER_URL: ${OPENHANDS_AGENT_SERVER_URL}
      LOCAL_BACKEND_API_KEY: ${OPENHANDS_SESSION_API_KEY}
      FILE_STORE: local
      LOCAL_STORAGE_PATH: /home/openhands/.openhands/storage
      AUTOMATION_AGENT_SERVER_URL: http://127.0.0.1:18000
      FACTORY_RUNTIME_ROOT: ${FACTORY_RUNTIME_ROOT:-/projects/cezar-factory}
    restart: unless-stopped
    ports:
      - "${OPENHANDS_BIND_ADDRESS:-127.0.0.1}:3001:8000"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - openhands-projects:/projects
      - ${FACTORY_RUNTIME_HOST_DIR}:/projects/cezar-factory:ro,Z

  hindsight:
    image: ${HINDSIGHT_IMAGE}
    env_file: .env
    environment:
      HINDSIGHT_API_LLM_PROVIDER: ${HINDSIGHT_API_LLM_PROVIDER}
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY}
      HINDSIGHT_API_LLM_BASE_URL: ${HINDSIGHT_API_LLM_BASE_URL}
      HINDSIGHT_API_LLM_MODEL: ${HINDSIGHT_API_LLM_MODEL}
      HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: ${HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS}
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: 8888
    volumes:
      - hindsight-data:/home/hindsight/.pg0:Z
    restart: always
    ports:
      - "127.0.0.1:8888:8888"

  litellm:
    image: ${LITELLM_IMAGE}
    env_file: .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_API_KEY: ${VLLM_API_KEY}
      NO_PROXY: ${NO_PROXY}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro,Z
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      litellm-db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4000"

  litellm-db:
    image: ${LITELLM_DB_IMAGE}
    environment:
      POSTGRES_DB: ${LITELLM_DB_NAME}
      POSTGRES_USER: ${LITELLM_DB_USER}
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LITELLM_DB_USER} -d ${LITELLM_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  langfuse:
    image: docker.langfuse.com/langfuse/langfuse:${LANGFUSE_IMAGE_TAG}
    depends_on:
      langfuse-worker:
        condition: service_started
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-event-storage-init:
        condition: service_completed_successfully
    environment:
      <<: *langfuse-shared-environment
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_PROJECT_RETENTION: ${LANGFUSE_RETENTION_DAYS:-30}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANGFUSE_WEB_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:${LANGFUSE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-event-storage-init:
        condition: service_completed_successfully
    environment: *langfuse-shared-environment

  langfuse-postgres:
    image: docker.io/library/postgres:${LANGFUSE_POSTGRES_VERSION}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER} -d ${LANGFUSE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:${LANGFUSE_CLICKHOUSE_VERSION}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse:Z
      - langfuse-clickhouse-logs:/var/log/clickhouse-server:Z
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${LANGFUSE_CLICKHOUSE_USER} --password ${LANGFUSE_CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: docker.io/library/redis:${LANGFUSE_REDIS_VERSION}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    # Chainguard amd64 manifest inspected on 2026-11-10; avoids the moving latest tag.
    image: cgr.dev/chainguard/minio@sha256:5cfb31567972802ece1a39bb076078fda00095c7d11e82be65e762c528994608
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/langfuse /data/langfuse-events && minio server --address :9000 --console-address :9001 /data"]
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse-minio-data:/data:Z
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_API_PORT:-9090}:9000"
      - "127.0.0.1:${LANGFUSE_MINIO_CONSOLE_PORT:-9091}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The event bucket is separate so its 30-day lifecycle never deletes media.
  # This one-shot service owns lifecycle rules for this integration-only bucket.
  langfuse-event-storage-init:
    image: cgr.dev/chainguard/minio@sha256:5cfb31567972802ece1a39bb076078fda00095c7d11e82be65e762c528994608
    restart: "no"
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command:
      - |
        days="${LANGFUSE_RETENTION_DAYS:-30}"
        case "$${days}" in ''|*[!0-9]*) echo 'LANGFUSE_RETENTION_DAYS must be an integer' >&2; exit 2 ;; esac
        mc alias set local http://langfuse-minio:9000 "$${LANGFUSE_MINIO_USER}" "$${LANGFUSE_MINIO_PASSWORD}"
        mc mb --ignore-existing local/langfuse-events
        mc ilm rule rm --all --force local/langfuse-events || true
        mc ilm rule add --expire-days "$${days}" local/langfuse-events
        # Retain historical event objects from the bucket used by earlier deployments.
        mc ilm rule add --prefix events/ --expire-days "$${days}" local/langfuse
    environment:
      LANGFUSE_RETENTION_DAYS: ${LANGFUSE_RETENTION_DAYS:-30}
      LANGFUSE_MINIO_USER: ${LANGFUSE_MINIO_USER}
      LANGFUSE_MINIO_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}

  # OSS has no project retention worker. Set supported ClickHouse table TTLs
  # after Langfuse has completed its migrations, then keep this reconciler alive.
  langfuse-clickhouse-retention:
    image: docker.io/clickhouse/clickhouse-server:${LANGFUSE_CLICKHOUSE_VERSION}
    restart: unless-stopped
    depends_on:
      langfuse:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        days="${LANGFUSE_RETENTION_DAYS:-30}"
        case "$${days}" in ''|*[!0-9]*) echo 'LANGFUSE_RETENTION_DAYS must be an integer' >&2; exit 2 ;; esac
        while :; do
          ready=1
          for item in 'traces timestamp' 'observations start_time' 'scores timestamp' 'event_log created_at'; do
            set -- $${item}
            count="$$(clickhouse-client --host langfuse-clickhouse --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --database default --query "SELECT count() FROM system.columns WHERE database = 'default' AND table = '$${1}' AND name = '$${2}'")"
            if [ "$${count}" != 1 ]; then ready=0; break; fi
          done
          if [ "$${ready}" = 1 ]; then
            clickhouse-client --host langfuse-clickhouse --user "$${CLICKHOUSE_USER}" --password "$${CLICKHOUSE_PASSWORD}" --database default --multiquery --query "ALTER TABLE traces MODIFY TTL timestamp + INTERVAL $${days} DAY DELETE; ALTER TABLE observations MODIFY TTL start_time + INTERVAL $${days} DAY DELETE; ALTER TABLE scores MODIFY TTL timestamp + INTERVAL $${days} DAY DELETE; ALTER TABLE event_log MODIFY TTL created_at + INTERVAL $${days} DAY DELETE"
            echo "Applied Langfuse ClickHouse retention: $${days} days"
            sleep infinity
          fi
          sleep 60
        done
    environment:
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      LANGFUSE_RETENTION_DAYS: ${LANGFUSE_RETENTION_DAYS:-30}

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - ./prometheus-model-targets.generated.json:/etc/prometheus/model-targets.json:ro
      - ./prometheus-vllm-token.generated:/etc/prometheus/vllm-token:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: ${GRAFANA_IMAGE}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3000"

  vault:
    image: ${VAULT_IMAGE}
    # The official image loads every file in /vault/config automatically.
    command: ["server"]
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault-config:/vault/config:ro,Z
      - vault-data:/vault/file:Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped

  cadvisor:
    image: ${CADVISOR_IMAGE}
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/containers:/var/lib/containers:ro
    restart: unless-stopped

volumes:
  cezar-factory-runtime:
  godot-versions:
  prometheus-data:
  grafana-data:
  openhands-data:
  openhands-projects:
  hindsight-data:
  litellm-db-data:
  vault-data:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-redis-data:
  langfuse-minio-data:
