global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: cezar
    static_configs:
      - targets: ["cezar:3000"]
  - job_name: openhands
    static_configs:
      - targets: ["openhands:3000"]
  - job_name: hindsight
    static_configs:
      - targets: ["hindsight:8888"]
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
  - job_name: model-host-vllm
    # The Mac proxy requires a bearer token on every path, /metrics included. The token file is rendered by
    # scripts/deploy/deploy-bazzite.sh from VLLM_API_KEY; without it the scrape is a 401 and `up` stays 0.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/vllm-token
    file_sd_configs:
      - files: ["/etc/prometheus/model-targets.json"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
