global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: cezar
    static_configs:
      - targets: ["cezar:3000"]
  - job_name: openhands
    static_configs:
      - targets: ["openhands:3000"]
  - job_name: hindsight
    static_configs:
      - targets: ["hindsight:8888"]
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
  - job_name: model-host-vllm
    file_sd_configs:
      - files: ["/etc/prometheus/model-targets.json"]
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
