# Prometheus for the Bazzite host as it actually runs: standalone containers, not the compose network.
# Rendered into $STATE/config by scripts/deploy/deploy-prometheus-standalone.sh and run with host networking,
# so every target is reachable on 127.0.0.1 or its LAN address. Only services that exist on this host are listed:
# a target that is never up would make the FactoryServiceDown alert fire forever.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: cezar
    static_configs:
      - targets: ["127.0.0.1:4321"]
  - job_name: hindsight
    static_configs:
      - targets: ["127.0.0.1:8888"]
  - job_name: model-host-vllm
    # The Mac proxy requires a bearer token on every path, /metrics included. The token and the target file are
    # rendered by the deploy script from VLLM_API_KEY and FACTORY_VLLM_METRICS_TARGET.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/vllm-token
    file_sd_configs:
      - files: ["/etc/prometheus/model-targets.json"]
