# Install to ~/.config/containers/containers.conf on the Bazzite host.
# The primary drive (/var, btrfs) is small. Image storage already lives on the secondary drive
# (graphroot in storage.conf), but Podman stages layer blobs in /var/tmp while building and pulling,
# which filled the primary drive and failed Cezar image builds ("no space left on device").
[engine]
image_copy_tmp_dir = "/var/mnt/podman/tmp"
