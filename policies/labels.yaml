# Primary workflow-state labels (mutually exclusive)
factory-state:
  - factory:new
  - factory:needs-plan
  - factory:needs-help
  - factory:ready
  - factory:working
  - factory:review
  - factory:changes-requested
  - factory:human-review
  - factory:blocked
  - factory:done
  - factory:investigate

# Factory classification labels that do not participate in lifecycle routing
factory-classification:
  - factory:tracking

# Work-type labels
type:
  - type:bug
  - type:feature
  - type:refactor
  - type:test
  - type:docs
  - type:maintenance

# Risk labels
risk:
  - risk:low
  - risk:medium
  - risk:high

# Estimated delivery complexity; exactly one is assigned by planning.
complexity:
  - complexity:small
  - complexity:medium
  - complexity:large

# Optional routing labels
agent:
  - agent:codex
  - agent:claude
  - agent:either
