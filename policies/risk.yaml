# Risk Policy

# Risk levels and their descriptions
risk-levels:
  risk:low:
    description: Low risk changes (documentation, tests, minor UI, small isolated bug fixes)
    requires-human-review: false
    requires-independent-review: true
    allows-auto-merge: true
    requires-human-plan-approval: false
    requires-human-merge: false
    requires-full-validation: false
    flow: implement -> test -> independent review -> auto-merge to dev
  risk:medium:
    description: Medium risk changes (feature work, refactoring, networking, persistence)
    requires-human-review: false
    requires-independent-review: true
    allows-auto-merge: true
    requires-human-plan-approval: false
    requires-human-merge: false
    requires-full-validation: false
    flow: implement -> test -> independent review -> auto-merge to dev
  risk:high:
    description: High risk changes (authentication, security, data migration, billing, large architectural changes, deployment infrastructure)
    requires-human-review: false
    requires-independent-review: true
    allows-auto-merge: true
    requires-human-plan-approval: false
    requires-human-merge: false
    requires-full-validation: true
    flow: implement -> full validation -> independent review -> auto-merge to dev; ask for user input only for an unresolved major architectural decision

# Risk assessment guidelines
assessment:
  blast-radius-factors:
    - Number of files changed
    - Public API changes
    - Database schema changes
    - Security/authentication changes
    - Performance impact
  change-type-factors:
    - Documentation: low
    - Tests: low
    - Refactoring: medium
    - New features: medium
    - Bug fixes: low-medium
    - Architectural changes: high
    - Security changes: high

# Human gate triggers
human-gates:
  plan-approval:
    trigger: an unresolved major architectural decision materially changes compatibility, ownership, or the system contract
    action: ask the user one focused question; risk level alone never blocks planning or implementation
  review:
    trigger: every implementation PR entering factory:review
    action: run independent technical review; do not wait for user review
  merge:
    trigger: approved and validated PRs for any risk level
    action: request GitHub auto-merge into dev
  escalation:
    trigger: repeated failures or investigation needed
    action: escalate with summary and context
