# podman compose -f compose.yaml up -d --build
services:
  cezar:
    image: localhost/cezar:local
    container_name: cezar
    build:
      context: .
      args:
        # Baseline Godot only; projects pin their own version in .godot-version (no rebuild needed).
        GODOT_VERSION: ${GODOT_VERSION:-4.7}
        GODOT_CHANNEL: ${GODOT_CHANNEL:-stable}
    restart: unless-stopped
    ports:
      # Host loopback only: cezar has NO built-in auth, so never publish on 0.0.0.0.
      - "127.0.0.1:4321:4321"
    environment:
      CEZ_REMOTE: "1"
      CEZ_OCR_ENABLED: ${CEZ_OCR_ENABLED:-0}
      CEZ_OCR_WORKER_URL: ${CEZ_OCR_WORKER_URL:-http://ocr-worker:8090}
      CEZ_OCR_WORKER_TOKEN: ${OCR_WORKER_TOKEN:-}
      CEZ_OCR_GATEWAY_URL: ${OCR_GATEWAY_URL:-http://litellm:4000/v1/chat/completions}
      CEZ_OCR_MODEL_ALIAS: ${OCR_MODEL_ALIAS:-}
      CEZ_OCR_RULE_PATH: /opt/ocr/rules.json
      CEZ_OCR_RULE_DIGEST: ${OCR_RULE_DIGEST:-}
      CEZ_OCR_POLICY_DIGEST: ${OCR_POLICY_DIGEST:-}
    networks:
      - default
      - ocr-private
    volumes:
      # cezar state (project registry, agent accounts) and the agent CLIs' logins survive rebuilds.
      - cezar-home:/home/cezar/.cezar
      - claude-home:/home/cezar/.claude
      - gh-config:/home/cezar/.config/gh
      - codex-home:/home/cezar/.codex
      - opencode-data:/home/cezar/.local/share/opencode
      - opencode-config:/home/cezar/.config/opencode
      # Godot versions installed on demand (godot-install); survive rebuilds so upgrades need no image change.
      - godot-versions:/opt/godot-versions
      # The repo cezar operates on (worktrees land in .ai/cezar/ inside it).
      - ${CEZAR_WORKSPACE:-.}:/workspace:Z
  ocr-worker:
    profiles: [ocr]
    build:
      context: ./ocr-worker
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: 2
    environment:
      OCR_WORKER_TOKEN: ${OCR_WORKER_TOKEN:-}
      OCR_GATEWAY_URL: ${OCR_GATEWAY_URL:-http://litellm:4000/v1/chat/completions}
      OCR_GATEWAY_TOKEN: ${OCR_GATEWAY_TOKEN:-}
      OCR_MODEL_ALIAS: ${OCR_MODEL_ALIAS:-}
      OCR_REPO_ROOT: /workspace
      OCR_RULE_PATH: /opt/ocr/rules.json
    volumes:
      - ${CEZAR_WORKSPACE:-.}:/workspace:ro,Z
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [ocr-private]
    expose: [8090]
volumes:
  cezar-home:
  claude-home:
  gh-config:
  codex-home:
  opencode-data:
  opencode-config:
  godot-versions:
networks:
  ocr-private:
    internal: true
