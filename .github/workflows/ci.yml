name: factory-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test-only Cezar workflow parser dependencies
        run: npm ci --prefix cezar --ignore-scripts --workspace @open-mercato/cezar --include-workspace-root=false
      - name: Validate Factory workflow contracts
        run: node ./tests/workflow-contracts.mjs
      - name: Factory self-test (static checks, install/update/diff/verify on fixtures)
        shell: pwsh
        run: ./tests/run-tests.ps1
      - name: Validate deterministic automation catalog
        shell: pwsh
        run: ./scripts/validate-automation-catalog.ps1
      - name: Release metadata validation
        shell: pwsh
        run: ./scripts/release/validate-release.ps1 -SkipTests
