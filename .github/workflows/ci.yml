name: factory-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independent verification fixture consumer
        run: node ./cezar/packages/cezar/src/verification/fixture-consumer.mjs
      - name: Verification contract tests and typechecks
        working-directory: ./cezar
        run: |
          npm ci
          npm run test -w @open-mercato/cezar -- src/verification/contract.test.ts
          npm run typecheck:contract
          npm run typecheck -w @open-mercato/cezar
      - name: Factory changed-scope validation (focused checks, full fallback on uncertainty)
        shell: pwsh
        run: ./scripts/factory/test-changed.ps1 -Task "GitHub pull request ${{ github.event.pull_request.number }}"
      - name: Autodeploy retry and parity integration tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash ./tests/test-factory-autodeploy.sh
